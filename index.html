<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POTOBOK EUY!</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff007f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Pustaka html2canvas untuk merender strip foto menjadi file gambar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .screen.active {
            display: flex;
            opacity: 1;
            pointer-events: auto;
        }

        /* --- HOME SCREEN --- */
        #screen-home {
            background: linear-gradient(-45deg, #ff007f, #7c4dff, #00e5ff, #00e676, #ffea00, #ff5722);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-title {
            font-family: 'Fredoka One', cursive;
            font-size: 44px;
            color: #ffffff;
            text-align: center;
            line-height: 1.1;
            letter-spacing: 2px;
            text-shadow: -3px 3px 0px #ff007f, -5px 5px 0px #00e5ff, 0 10px 25px rgba(0,0,0,0.3);
        }

        .camera-icon-wrapper {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .camera-icon-wrapper svg { 
            color: #ff007f; 
            width: 50px; 
            height: 50px; 
        }

        .home-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 280px;
            align-items: center;
        }

        .btn {
            background: #ffffff;
            border: none;
            border-radius: 50px;
            width: 100%;
            padding: 13px 20px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:active { transform: scale(0.95); }
        .btn-primary { color: #6a0dad; }
        .btn-gallery { color: #00897b; background: rgba(255,255,255,0.95); }
        .btn-install { color: #ffffff; background: #ff007f; display: none; } /* Tombol instal otomatis muncul jika didukung */
        .btn-secondary { color: #ff5722; background: rgba(255,255,255,0.9); flex-shrink: 0; }
        .btn-download { color: #e91e63; background: #ffffff; }

        /* --- TEMPLATE SCREEN --- */
        #screen-template {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
        }

        .subtitle {
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            color: #fff;
            text-shadow: -2px 2px 0px #ff007f;
            text-align: center;
            flex-shrink: 0;
            margin-top: 5px;
        }

        .template-scroll-area {
            width: 100%;
            max-width: 480px;
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            justify-content: center;
            padding: 10px 0;
            margin: 10px 0;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 460px;
            justify-items: center;
            align-content: start;
        }

        .template-preview-card {
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }

        .template-preview-card:active { transform: scale(0.95); }

        .mini-strip {
            width: 100px;
            height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .mini-slot {
            width: 100%;
            flex: 1;
            background: #ffffff;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fredoka One', cursive;
            font-size: 13px;
            color: #444;
        }

        /* --- 12 TEMPLATE THEMES --- */
        .strip-theme-1 { background: #ffffff; padding: 8px; gap: 5px; border: 2px solid #e0e0e0; }
        .strip-theme-2 { background: #121212; padding: 8px; gap: 5px; border: 2px solid #333; }
        .strip-theme-3 { background: linear-gradient(135deg, #ff007f, #00e5ff); padding: 8px; gap: 5px; }
        .strip-theme-4 { background: #fff0f5; padding: 8px; gap: 5px; border: 3px dashed #ff69b4; border-radius: 12px; }
        .strip-theme-5 { background: linear-gradient(135deg, #fff8e1, #ffecb3); padding: 8px; gap: 5px; border: 2px solid #ffb300; border-radius: 10px; }
        .strip-theme-6 { background: linear-gradient(135deg, #ede7f6, #d1c4e9); padding: 8px; gap: 5px; border: 2px solid #7c4dff; border-radius: 10px; }
        .strip-theme-7 { background: linear-gradient(135deg, #e0f2f1, #b2dfdb); padding: 8px; gap: 5px; border: 2px solid #00bfa5; border-radius: 10px; }
        .strip-theme-8 { background: #263238; padding: 8px; gap: 5px; border: 2px solid #ffca28; border-radius: 10px; }
        .strip-theme-9 { background: linear-gradient(135deg, #ff8a80, #ff5252); padding: 8px; gap: 5px; border: 2px solid #d32f2f; border-radius: 10px; }
        .strip-theme-10 { background: linear-gradient(135deg, #81d4fa, #0288d1); padding: 8px; gap: 5px; border: 2px solid #01579b; border-radius: 10px; }
        .strip-theme-11 { background: linear-gradient(135deg, #f8bbd0, #e91e63); padding: 8px; gap: 5px; border: 2px solid #c2185b; border-radius: 10px; }
        .strip-theme-12 { background: linear-gradient(135deg, #dcedc8, #689f38); padding: 8px; gap: 5px; border: 2px solid #33691e; border-radius: 10px; }

        /* --- CAMERA SCREEN --- */
        #screen-camera {
            background: linear-gradient(-45deg, #ff007f, #7c4dff, #00e5ff, #00e676);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
            padding: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #screen-camera.active { display: flex; }

        .camera-top-title {
            position: absolute;
            top: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: -2px 2px 0px #ff007f, 0 4px 15px rgba(0,0,0,0.5);
            z-index: 5;
            text-align: center;
            width: 100%;
        }

        .photo-indicator {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            z-index: 6;
            letter-spacing: 1px;
            display: none;
        }

        .camera-view-container {
            position: relative;
            width: 85%;
            max-width: 380px;
            aspect-ratio: 4 / 3;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 3px solid rgba(255,255,255,0.4);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #live-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #captured-preview-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transform: scaleX(-1);
            z-index: 2;
            display: none;
        }

        .camera-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 30px;
        }

        .btn-cam-back {
            position: absolute;
            left: 25px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 2px solid #fff;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .btn-capture {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.3), rgba(0, 229, 255, 0.3));
            border: 4px solid transparent;
            background-image: linear-gradient(135deg, rgba(255,0,127,0.3), rgba(0,229,255,0.3)), linear-gradient(135deg, #ff007f, #00e5ff);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
        }
        .btn-capture:active { transform: scale(0.9); }

        .countdown-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Fredoka One', cursive;
            font-size: 140px;
            color: #ffffff;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px #ff007f;
            z-index: 4;
            display: none;
            animation: popIn 1s infinite;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
        }

        .flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 15; opacity: 0; pointer-events: none;
            transition: opacity 0.15s ease-out;
        }

        /* --- RESULT SCREEN --- */
        #screen-result {
            justify-content: center;
            align-items: center;
            padding: 15px 20px;
            overflow-y: auto;
            position: relative;
        }

        .result-title {
            color: white;
            font-family: 'Fredoka One', cursive;
            margin-bottom: 12px;
            font-size: 20px;
            text-align: center;
            z-index: 2;
        }

        .result-layout-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 360px;
            margin-bottom: 16px;
            z-index: 2;
        }

        .frame-result {
            width: 230px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            margin: 0 auto;
        }

        .strip-header { text-align: center; font-family: 'Fredoka One', cursive; font-size: 11px; padding: 6px 0; letter-spacing: 1px; }
        .photo-slot-wrapper { position: relative; width: 100%; aspect-ratio: 4 / 3; box-sizing: border-box; }
        .photo-slot { width: 100%; height: 100%; background-size: cover; background-position: center; transform: scaleX(-1); position: relative; }
        .strip-footer { text-align: center; font-size: 10px; font-weight: 700; padding: 6px 0; letter-spacing: 1px; }

        .btn-open-filter {
            position: absolute;
            right: -10px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.85);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .btn-open-filter:active { transform: scale(0.9); }
        .btn-open-filter svg { width: 22px; height: 22px; }

        /* Filter Modal */
        .filter-modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 50; display: flex;
            flex-direction: column; justify-content: space-between; align-items: center;
            padding: 12px 15px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            backdrop-filter: blur(12px); overflow-y: auto;
        }
        .filter-modal-overlay.active { opacity: 1; pointer-events: auto; }
        .filter-modal-header { font-family: 'Fredoka One', cursive; color: #fff; font-size: 16px; margin-top: 2px; text-align: center; flex-shrink: 0; }
        .filter-modal-preview-area { display: flex; justify-content: center; align-items: center; width: 100%; margin: 5px 0; flex: 1; overflow-y: auto; }
        .filter-modal-preview-area .frame-result { width: 210px !important; transform: scale(1); }

        .filter-controls-area {
            width: 100%; max-width: 360px; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px; border-radius: 18px;
            display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(8px); flex-shrink: 0;
        }
        .filter-options-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; }
        .filter-option-btn {
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 6px 2px; border-radius: 8px; color: #fff; font-family: 'Poppins', sans-serif;
            font-weight: 600; font-size: 9px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 3px; text-align: center;
        }
        .filter-option-btn.active { background: #ff007f; border-color: #ff007f; box-shadow: 0 0 10px rgba(255,0,127,0.6); }
        .filter-option-btn svg { width: 14px; height: 14px; }

        .result-actions { display: flex; gap: 12px; width: 100%; max-width: 360px; justify-content: center; z-index: 2; }
        .result-actions .btn { padding: 12px 10px; font-size: 13px; margin-bottom: 0; flex: 1; white-space: nowrap; }

        /* GALLERY SCREEN */
        #screen-gallery { background: linear-gradient(135deg, #111, #1a1a2e); justify-content: flex-start; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; }
        .gallery-scroll-area { width: 100%; max-width: 480px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; justify-content: center; padding-bottom: 10px; }
        .gallery-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; justify-items: center; align-content: start; }
        .gallery-item { width: 160px; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.5); cursor: pointer; }
        .empty-gallery { color: #aaa; text-align: center; font-size: 15px; margin-top: 40px; font-style: italic; }
        .gallery-footer-action { width: 100%; max-width: 200px; flex-shrink: 0; margin-top: 10px; display: flex; justify-content: center; }

        /* Modal Gallery */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 100; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content-wrapper { max-height: 70vh; overflow-y: auto; display: flex; justify-content: center; width: 100%; margin-bottom: 15px; }
        .modal-actions { display: flex; gap: 10px; width: 100%; max-width: 280px; justify-content: center; }
        .modal-actions .btn { padding: 10px; font-size: 13px; flex: 1; }
        #capture-canvas { display: none; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- HOME SCREEN -->
        <div id="screen-home" class="screen active">
            <h1 class="main-title">POTOBOK<br>EUY!</h1>
            
            <div class="camera-icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </div>

            <div class="home-buttons-container">
                <button class="btn btn-primary" onclick="navigate('screen-template')">
                    MULAI FOTO
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>

                <!-- Tombol Install Aplikasi Langsung dari Web -->
                <button id="btn-install-app" class="btn btn-install" onclick="installApp()">
                    APLIKASI DIINSTAL
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>

                <button class="btn btn-gallery" onclick="openGalleryFromHome()">
                    GALERI FOTO
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </button>
            </div>
        </div>

        <!-- TEMPLATE SCREEN -->
        <div id="screen-template" class="screen">
            <h2 class="subtitle">PILIH TEMPLATE</h2>
            
            <div class="template-scroll-area">
                <div class="template-grid">
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-1')"><div class="mini-strip strip-theme-1"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-2')"><div class="mini-strip strip-theme-2"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-3')"><div class="mini-strip strip-theme-3"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-4')"><div class="mini-strip strip-theme-4"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-5')"><div class="mini-strip strip-theme-5"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-6')"><div class="mini-strip strip-theme-6"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-7')"><div class="mini-strip strip-theme-7"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-8')"><div class="mini-strip strip-theme-8"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-9')"><div class="mini-strip strip-theme-9"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-10')"><div class="mini-strip strip-theme-10"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-11')"><div class="mini-strip strip-theme-11"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                    <div class="template-preview-card" onclick="prepareCamera('strip-theme-12')"><div class="mini-strip strip-theme-12"><div class="mini-slot">1</div><div class="mini-slot">2</div><div class="mini-slot">3</div></div></div>
                </div>
            </div>

            <button class="btn btn-secondary" style="max-width: 180px; padding: 10px; font-size: 14px; flex-shrink: 0;" onclick="navigate('screen-home')">KEMBALI</button>
        </div>

        <!-- CAMERA SCREEN -->
        <div id="screen-camera" class="screen">
            <div class="camera-top-title">POTOBOK EUY!</div>
            <div id="photo-indicator" class="photo-indicator">FOTO 1 / 3</div>

            <div class="camera-view-container">
                <video id="live-video" autoplay playsinline muted></video>
                <div id="captured-preview-box"></div>
            </div>
            
            <div id="countdown-text" class="countdown-text">3</div>

            <div id="camera-ui" class="camera-controls">
                <button class="btn-cam-back" onclick="stopPhotobox()">Batal</button>
                <button class="btn-capture" onclick="startCaptureSequence()"></button>
            </div>

            <div id="flash-effect" class="flash-overlay"></div>
            <canvas id="capture-canvas"></canvas>
        </div>

        <!-- RESULT SCREEN -->
        <div id="screen-result" class="screen">
            <h2 class="result-title">HASIL FOTO KAMU!</h2>
            
            <div class="result-layout-wrapper">
                <div id="final-frame" class="frame-result">
                    <div class="strip-header">POTOBOK EUY!</div>
                    <div class="photo-slot-wrapper"><div class="photo-slot photo-filter-normal" id="slot-1"></div></div>
                    <div class="photo-slot-wrapper"><div class="photo-slot photo-filter-normal" id="slot-2"></div></div>
                    <div class="photo-slot-wrapper"><div class="photo-slot photo-filter-normal" id="slot-3"></div></div>
                    <div class="strip-footer">EUY • 2026</div>
                </div>

                <button class="btn-open-filter" onclick="openFilterModal()" title="Pilih Efek/Filter">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4m-4.93-7.07l-2.83 2.83m-8.48 8.48l-2.83 2.83"/></svg>
                </button>
            </div>

            <div class="result-actions">
                <button class="btn btn-primary" onclick="navigate('screen-template')">FOTO LAGI</button>
                <button id="btn-download-action" class="btn btn-download" onclick="downloadStripPhoto('final-frame', 'btn-download-action')">DOWNLOAD</button>
                <button class="btn btn-gallery" onclick="openGalleryFromResult()">GALERI</button>
            </div>
        </div>

        <!-- FILTER MODAL -->
        <div id="filter-modal" class="filter-modal-overlay">
            <div class="filter-modal-header">PILIH EFEK & FILTER (10 OPSI)</div>
            <div class="filter-modal-preview-area" id="modal-filter-preview-container"></div>
            <div class="filter-controls-area">
                <div class="filter-options-grid">
                    <button class="filter-option-btn active" id="f-btn-normal" onclick="applyPhotoFilter('normal', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Normal</button>
                    <button class="filter-option-btn" id="f-btn-fuji" onclick="applyPhotoFilter('fuji', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/></svg>Fujifilm</button>
                    <button class="filter-option-btn" id="f-btn-kodak" onclick="applyPhotoFilter('kodak', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2m10-10h-2M4 12H2"/></svg>Kodak</button>
                    <button class="filter-option-btn" id="f-btn-cyber" onclick="applyPhotoFilter('cyber', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Cyberpunk</button>
                    <button class="filter-option-btn" id="f-btn-cine" onclick="applyPhotoFilter('cine', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>Cinematic</button>
                    <button class="filter-option-btn" id="f-btn-bw" onclick="applyPhotoFilter('bw', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>B & W</button>
                    <button class="filter-option-btn" id="f-btn-sepia" onclick="applyPhotoFilter('sepia', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16l4.586-4.586a2 2 0 0 1 2.828 0L16 16"/></svg>Sepia</button>
                    <button class="filter-option-btn" id="f-btn-vintage" onclick="applyPhotoFilter('vintage', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Vintage</button>
                    <button class="filter-option-btn" id="f-btn-cool" onclick="applyPhotoFilter('cool', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>Cool Blue</button>
                    <button class="filter-option-btn" id="f-btn-moody" onclick="applyPhotoFilter('moody', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3"/></svg>Moody</button>
                </div>
                <button class="btn btn-primary" style="padding: 8px; font-size: 13px;" onclick="closeFilterModal()">SELESAI</button>
            </div>
        </div>

        <!-- GALLERY SCREEN -->
        <div id="screen-gallery" class="screen">
            <h2 class="subtitle">GALERI FOTO</h2>
            <div class="gallery-scroll-area">
                <div>
                    <div id="gallery-container" class="gallery-container"></div>
                    <div id="empty-gallery-msg" class="empty-gallery">Belum ada foto tersimpan di galeri.</div>
                </div>
            </div>
            <div class="gallery-footer-action">
                <button class="btn btn-secondary" style="padding: 11px; font-size: 14px;" onclick="handleGalleryBack()">KEMBALI</button>
            </div>
        </div>

        <!-- GALLERY MODAL -->
        <div id="gallery-modal" class="modal-overlay" onclick="closeModal()">
            <div class="modal-content-wrapper" id="modal-strip-container" onclick="event.stopPropagation()"></div>
            <div class="modal-actions" onclick="event.stopPropagation()">
                <button id="btn-modal-download" class="btn btn-download" onclick="downloadModalStrip()">DOWNLOAD</button>
                <button class="btn btn-secondary" onclick="closeModal()">TUTUP</button>
            </div>
        </div>

    </div>

    <script>
        let cameraStream = null;
        let selectedTheme = 'strip-theme-1';
        let capturedPhotos = [];
        let currentPhotoIndex = 0;
        let isSimulated = false;
        let audioCtx = null;
        let photoGallery = JSON.parse(localStorage.getItem('potobok_gallery') || '[]');
        let openedFromScreen = 'home';
        let currentFilter = 'normal';

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('btn-install-app');
            if (installBtn) installBtn.style.display = 'flex';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('btn-install-app').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function playFocusBeep() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function playCameraShutter() {
            try {
                initAudio();
                const bufferSize = audioCtx.sampleRate * 0.12;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e) {}
        }

        function navigate(targetScreenId) {
            document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
            document.getElementById(targetScreenId).classList.add('active');
        }

        async function prepareCamera(themeClass) {
            selectedTheme = themeClass;
            capturedPhotos = [];
            currentPhotoIndex = 0;
            isSimulated = false;
            navigate('screen-camera');
            document.getElementById('camera-ui').style.display = 'flex';
            document.getElementById('photo-indicator').style.display = 'none';
            document.getElementById('countdown-text').style.display = 'none';
            document.getElementById('captured-preview-box').style.display = 'none';
            const videoEl = document.getElementById('live-video');
            videoEl.style.display = 'block';

            try {
                if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
                videoEl.srcObject = cameraStream;
                await videoEl.play();
            } catch (error) {
                isSimulated = true;
                videoEl.style.display = 'none';
            }
        }

        function stopPhotobox() {
            if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
            navigate('screen-template');
        }

        function startCaptureSequence() {
            document.getElementById('camera-ui').style.display = 'none';
            document.getElementById('photo-indicator').style.display = 'block';
            takeNextPhoto();
        }

        function takeNextPhoto() {
            if (currentPhotoIndex >= 3) { processResult(); return; }
            document.getElementById('captured-preview-box').style.display = 'none';
            document.getElementById('live-video').style.display = 'block';
            document.getElementById('photo-indicator').innerText = `FOTO ${currentPhotoIndex + 1} / 3`;

            let countdown = 3;
            const cdText = document.getElementById('countdown-text');
            cdText.style.display = 'block';
            cdText.style.animation = 'none'; cdText.offsetHeight; cdText.style.animation = 'popIn 1s infinite';
            cdText.innerText = countdown;
            playBeep();

            const timer = setInterval(() => {
                countdown--;
                if (countdown > 1) { cdText.innerText = countdown; playBeep(); }
                else if (countdown === 1) { cdText.innerText = countdown; playFocusBeep(); }
                else {
                    clearInterval(timer);
                    cdText.style.display = 'none';
                    playCameraShutter();
                    snapAndSaveFrame();
                    currentPhotoIndex++;
                    if (currentPhotoIndex < 3) setTimeout(() => takeNextPhoto(), 2500);
                    else setTimeout(() => processResult(), 1500);
                }
            }, 1000);
        }

        function snapAndSaveFrame() {
            const flash = document.getElementById('flash-effect');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 150);

            let dataUrl = "";
            const videoEl = document.getElementById('live-video');
            if (!isSimulated && videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
                const canvas = document.getElementById('capture-canvas');
                const context = canvas.getContext('2d');
                const vWidth = videoEl.videoWidth, vHeight = videoEl.videoHeight;
                let sWidth = vWidth, sHeight = vWidth * (3 / 4), sx = 0, sy = (vHeight - sHeight) / 2;
                if (sHeight > vHeight) { sHeight = vHeight; sWidth = vHeight * (4 / 3); sx = (vWidth - sWidth) / 2; sy = 0; }
                canvas.width = 640; canvas.height = 480;
                context.drawImage(videoEl, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
                dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            } else {
                const colors = ['#ff5722', '#00bcd4', '#8bc34a'];
                dataUrl = `https://placehold.co/600x450/${colors[currentPhotoIndex].replace('#','')}/ffffff?text=FOTO+${currentPhotoIndex+1}`;
            }
            capturedPhotos.push(dataUrl);
            videoEl.style.display = 'none';
            const previewBox = document.getElementById('captured-preview-box');
            previewBox.style.backgroundImage = `url(${dataUrl})`;
            previewBox.style.display = 'block';
        }

        const themeBackgrounds = {
            'strip-theme-1': 'linear-gradient(135deg, #2b2b2b, #111111)',
            'strip-theme-2': 'linear-gradient(135deg, #050505, #1a1a1a)',
            'strip-theme-3': 'linear-gradient(135deg, #ff007f, #7c4dff, #00e5ff)',
            'strip-theme-4': 'linear-gradient(135deg, #ffb6c1, #ff69b4, #db7093)',
            'strip-theme-5': 'linear-gradient(135deg, #ffb300, #ff8f00, #ff6f00)',
            'strip-theme-6': 'linear-gradient(135deg, #7c4dff, #512da8, #311b92)',
            'strip-theme-7': 'linear-gradient(135deg, #00bfa5, #00897b, #004d40)',
            'strip-theme-8': 'linear-gradient(135deg, #37474f, #263238, #000000)',
            'strip-theme-9': 'linear-gradient(135deg, #ff5252, #d32f2f, #b71c1c)',
            'strip-theme-10': 'linear-gradient(135deg, #039be5, #0288d1, #01579b)',
            'strip-theme-11': 'linear-gradient(135deg, #e91e63, #c2185b, #880e4f)',
            'strip-theme-12': 'linear-gradient(135deg, #689f38, #33691e, #1b5e20)'
        };

        function processResult() {
            if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
            document.getElementById('photo-indicator').style.display = 'none';
            const finalFrame = document.getElementById('final-frame');
            finalFrame.className = `frame-result ${selectedTheme}`;
            document.getElementById('screen-result').style.background = themeBackgrounds[selectedTheme] || 'linear-gradient(135deg, #111, #222)';

            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i + 1}`);
                if (capturedPhotos[i]) slot.style.backgroundImage = `url(${capturedPhotos[i]})`;
            }
            applyPhotoFilter('normal', document.getElementById('f-btn-normal'));

            const stripRecord = { theme: selectedTheme, photos: [...capturedPhotos], date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) };
            photoGallery.unshift(stripRecord);
            if (photoGallery.length > 25) photoGallery.pop();
            localStorage.setItem('potobok_gallery', JSON.stringify(photoGallery));
            navigate('screen-result');
        }

        function openFilterModal() {
            const modalPreviewContainer = document.getElementById('modal-filter-preview-container');
            modalPreviewContainer.innerHTML = document.getElementById('final-frame').outerHTML;
            const modalFrame = modalPreviewContainer.querySelector('.frame-result');
            if (modalFrame) modalFrame.id = 'modal-preview-frame';
            document.getElementById('filter-modal').classList.add('active');
        }

        function closeFilterModal() { document.getElementById('filter-modal').classList.remove('active'); }

        function applyPhotoFilter(filterType, btnElement) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-option-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            let filterStyle = 'none';
            if (filterType === 'fuji') filterStyle = 'contrast(115%) saturate(125%) brightness(102%) sepia(15%) hue-rotate(-10deg)';
            if (filterType === 'kodak') filterStyle = 'contrast(120%) saturate(140%) sepia(30%) brightness(98%)';
            if (filterType === 'cyber') filterStyle = 'contrast(130%) saturate(180%) hue-rotate(190deg) brightness(105%)';
            if (filterType === 'cine') filterStyle = 'contrast(125%) saturate(110%) hue-rotate(15deg) brightness(95%)';
            if (filterType === 'bw') filterStyle = 'grayscale(100%) contrast(125%)';
            if (filterType === 'sepia') filterStyle = 'sepia(100%) contrast(110%) brightness(95%)';
            if (filterType === 'vintage') filterStyle = 'sepia(50%) hue-rotate(-30deg) contrast(130%) brightness(90%) saturate(80%)';
            if (filterType === 'cool') filterStyle = 'hue-rotate(180deg) saturate(130%) brightness(100%)';
            if (filterType === 'moody') filterStyle = 'contrast(135%) brightness(85%) saturate(80%)';

            for (let i = 1; i <= 3; i++) {
                const slotMain = document.getElementById(`slot-${i}`);
                if (slotMain) slotMain.style.filter = filterStyle;
            }
            const modalPreviewContainer = document.getElementById('modal-filter-preview-container');
            if (modalPreviewContainer) modalPreviewContainer.querySelectorAll('.photo-slot').forEach(slot => slot.style.filter = filterStyle);
        }

        function downloadStripPhoto(elementId, buttonId) {
            const btnDownload = document.getElementById(buttonId);
            btnDownload.innerText = "Menyimpan..."; btnDownload.style.opacity = "0.7"; btnDownload.style.pointerEvents = "none";
            setTimeout(() => {
                const frame = document.getElementById(elementId);
                html2canvas(frame, { scale: 2, useCORS: true, backgroundColor: null }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `potobok-euy-${Date.now()}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                    btnDownload.innerText = "DOWNLOAD"; btnDownload.style.opacity = "1"; btnDownload.style.pointerEvents = "auto";
                }).catch(() => {
                    btnDownload.innerText = "DOWNLOAD"; btnDownload.style.opacity = "1"; btnDownload.style.pointerEvents = "auto";
                });
            }, 500);
        }

        function downloadModalStrip() { downloadStripPhoto('modal-preview-frame', 'btn-modal-download'); }

        function openGalleryFromHome() { openedFromScreen = 'home'; renderGallery(); }
        function openGalleryFromResult() { openedFromScreen = 'result'; renderGallery(); }

        function renderGallery() {
            photoGallery = JSON.parse(localStorage.getItem('potobok_gallery') || '[]');
            const container = document.getElementById('gallery-container');
            const emptyMsg = document.getElementById('empty-gallery-msg');
            container.innerHTML = '';

            if (photoGallery.length === 0) {
                emptyMsg.style.display = 'block';
            } else {
                emptyMsg.style.display = 'none';
                photoGallery.forEach((item) => {
                    let themeClass = item.theme || 'strip-theme-1';
                    const div = document.createElement('div');
                    div.className = `frame-result gallery-item ${themeClass}`;
                    div.style.transform = 'scale(1)'; div.style.margin = '0';
                    div.innerHTML = `
                        <div class="strip-header">POTOBOK EUY!</div>
                        <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[0]})"></div></div>
                        <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[1]})"></div></div>
                        <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[2]})"></div></div>
                        <div class="strip-footer">${item.date}</div>
                    `;
                    div.onclick = () => showGalleryDetail(item, themeClass);
                    container.appendChild(div);
                });
            }
            navigate('screen-gallery');
        }

        function showGalleryDetail(item, themeClass) {
            document.getElementById('modal-strip-container').innerHTML = `
                <div id="modal-strip-element" class="frame-result ${themeClass}" style="width: 240px;">
                    <div class="strip-header">POTOBOK EUY!</div>
                    <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[0]})"></div></div>
                    <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[1]})"></div></div>
                    <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[2]})"></div></div>
                    <div class="strip-footer">${item.date}</div>
                </div>
            `;
            document.getElementById('gallery-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('gallery-modal').classList.remove('active'); }

        function handleGalleryBack() {
            if (openedFromScreen === 'result') navigate('screen-result');
            else navigate('screen-home');
        }
    </script>
</body>
</html>

                <div class="template-preview-card" onclick="prepareCamera('theme-strip8')">

                <div class="template-preview-card" onclick="prepareCamera('theme-strip9')">

                <div class="template-preview-card" onclick="prepareCamera('theme-strip10')">

    <script>
        let cameraStream = null;
        let selectedTheme = '';
        let capturedPhotos = [];
        let currentPhotoIndex = 0;
        let isSimulated = false;
        let audioCtx = null;
        
        let photoGallery = JSON.parse(localStorage.getItem('vns_gallery') || '[]');
        let openedFromScreen = 'home';

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function playFocusBeep() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function playCameraShutter() {
            try {
                initAudio();
                const bufferSize = audioCtx.sampleRate * 0.12;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch(e) {}
        }

        function navigate(targetScreenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(targetScreenId).classList.add('active');
        }

        async function prepareCamera(themeClass) {
            selectedTheme = themeClass;
            capturedPhotos = [];
            currentPhotoIndex = 0;
            isSimulated = false;

            navigate('screen-camera');
            
            document.getElementById('camera-ui').style.display = 'flex';
            document.getElementById('photo-indicator').style.display = 'none';
            document.getElementById('countdown-text').style.display = 'none';

            const videoEl = document.getElementById('live-video');

            try {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: { 
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = cameraStream;
                await videoEl.play();
                videoEl.style.display = 'block';
                document.getElementById('screen-camera').style.background = '#111';
            } catch (error) {
                isSimulated = true;
                videoEl.style.display = 'none';
                document.getElementById('screen-camera').style.background = '#444';
            }
        }

        function stopPhotobox() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            navigate('screen-template');
        }

        function startCaptureSequence() {
            document.getElementById('camera-ui').style.display = 'none';
            document.getElementById('photo-indicator').style.display = 'block';
            takeNextPhoto();
        }

        function takeNextPhoto() {
            if (currentPhotoIndex >= 3) {
                processResult();
                return;
            }

            document.getElementById('photo-indicator').innerText = `FOTO ${currentPhotoIndex + 1} / 3`;

            let countdown = 3;
            const cdText = document.getElementById('countdown-text');
            cdText.style.display = 'block';
            cdText.style.animation = 'none';
            cdText.offsetHeight; 
            cdText.style.animation = 'popIn 1s infinite';
            cdText.innerText = countdown;

            playBeep();

            const timer = setInterval(() => {
                countdown--;
                if (countdown > 1) {
                    cdText.innerText = countdown;
                    playBeep();
                } else if (countdown === 1) {
                    cdText.innerText = countdown;
                    playFocusBeep();
                } else {
                    clearInterval(timer);
                    cdText.style.display = 'none';
                    
                    playCameraShutter();
                    snapAndSaveFrame();
                    
                    currentPhotoIndex++;
                    
                    if (currentPhotoIndex < 3) {
                        setTimeout(() => {
                            takeNextPhoto();
                        }, 2000);
                    } else {
                        setTimeout(() => {
                            processResult();
                        }, 1000);
                    }
                }
            }, 1000);
        }

        function snapAndSaveFrame() {
            const flash = document.getElementById('flash-effect');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 150);

            let dataUrl = "";
            const videoEl = document.getElementById('live-video');

            if (!isSimulated && videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
                const canvas = document.getElementById('capture-canvas');
                const context = canvas.getContext('2d');
                
                canvas.width = videoEl.videoWidth || 640;
                canvas.height = videoEl.videoHeight || 480;
                
                context.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            } else {
                const colors = ['#ff5722', '#00bcd4', '#8bc34a'];
                dataUrl = `https://placehold.co/600x450/${colors[currentPhotoIndex].replace('#','')}/ffffff?text=FOTO+${currentPhotoIndex+1}`;
            }

            capturedPhotos.push(dataUrl);
        }

        function processResult() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            
            document.getElementById('photo-indicator').style.display = 'none';

            const finalFrame = document.getElementById('final-frame');
            finalFrame.className = `frame-result ${selectedTheme}`;

            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i + 1}`);
                if (capturedPhotos[i]) {
                    slot.style.backgroundImage = `url(${capturedPhotos[i]})`;
                }
            }

            const stripRecord = {
                theme: selectedTheme,
                photos: [...capturedPhotos],
                date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
            };

            photoGallery.unshift(stripRecord);
            if (photoGallery.length > 25) photoGallery.pop();
            localStorage.setItem('vns_gallery', JSON.stringify(photoGallery));

            navigate('screen-result');
        }

        function openGalleryFromHome() {
            openedFromScreen = 'home';
            renderGallery();
        }

        function openGalleryFromResult() {
            openedFromScreen = 'result';
            renderGallery();
        }

        function renderGallery() {
            photoGallery = JSON.parse(localStorage.getItem('vns_gallery') || '[]');
            
            const container = document.getElementById('gallery-container');
            const emptyMsg = document.getElementById('empty-gallery-msg');
            container.innerHTML = '';

            if (photoGallery.length === 0) {
                emptyMsg.style.display = 'block';
            } else {
                emptyMsg.style.display = 'none';
                photoGallery.forEach((item) => {
                    const div = document.createElement('div');
                    div.className = `frame-result gallery-item ${item.theme}`;
                    div.style.transform = 'scale(1)';
                    div.style.margin = '0';
                    
                    div.innerHTML = `
                        <div class="strip-header" style="font-size:10px; padding:4px 0;">VNS PHOTOBOX</div>
                        <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[0]})"></div></div>
                        <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[1]})"></div></div>
                        <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[2]})"></div></div>
                        <div class="strip-footer" style="font-size:8px; padding:3px 0;">${item.date}</div>
                    `;

                    div.onclick = () => showGalleryDetail(item);
                    container.appendChild(div);
                });
            }

            navigate('screen-gallery');
        }

        function showGalleryDetail(item) {
            const modalContainer = document.getElementById('modal-strip-container');
            modalContainer.innerHTML = `
                <div class="frame-result ${item.theme}" style="width: 210px;">
                    <div class="strip-header">VNS PHOTOBOX</div>
                    <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[0]})"></div></div>
                    <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[1]})"></div></div>
                    <div class="photo-slot-wrapper"><div class="photo-slot" style="background-image: url(${item.photos[2]})"></div></div>
                    <div class="strip-footer">${item.date}</div>
                </div>
            `;
            document.getElementById('gallery-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('gallery-modal').classList.remove('active');
        }

        function handleGalleryBack() {
            if (openedFromScreen === 'result') {
                navigate('screen-result');
            } else {
                navigate('screen-home');
            }
        }
    </script>
</body>
</html>
